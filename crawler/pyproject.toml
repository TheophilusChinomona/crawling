[project]
name = "leadcrawl-crawler"
version = "0.1.0"
description = "LeadCrawl crawling engine powered by Crawlee (Python)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crawlee[playwright,beautifulsoup]>=1.0",
    "markdownify>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadcrawl_crawler"]

[tool.hatch.build.targets.sdist]
include = ["src/leadcrawl_crawler"]
